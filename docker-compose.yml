services:

  api:
    build:
      context: ./backend

    container_name: bookvault_api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

  db:
    image: postgres:16

    container_name: bookvault_db

    restart: always

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - ./database:/var/lib/postgresql/data